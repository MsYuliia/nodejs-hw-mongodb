tags:
  - Auth
summary: User login
operationId: loginUser
description: Authenticate a user and return access and refresh tokens.
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            format: email
            example: user@example.com
          password:
            type: string
            format: password
            example: password123
responses:
  '200':
    description: Successfully authenticated
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user!
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: n4GmEj7h+JhJ/aRs/UTJr/jf1h6JGZ+APLR5be2y
  '401':
    description: Invalid credentials
    $ref: '../../components/responses/401.yaml'
  '500':
    description: Internal server error
