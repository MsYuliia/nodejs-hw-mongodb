tags:
  - Auth
summary: User logout
operationId: logoutUser
description: Log out the authenticated user and invalidate the refresh token.
security:
  - bearerAuth: []
responses:
  '200':
    description: Successfully logged out
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: Successfully logged out
  '401':
    description: Unauthorized
    $ref: '../../components/responses/401.yaml'
  '500':
    description: Internal server error
