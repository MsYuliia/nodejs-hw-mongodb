tags:
  - Auth
summary: User registration
operationId: registerUser
description: Register a new user.
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            type: string
            example: John Doe
          email:
            type: string
            format: email
            example: user@example.com
          password:
            type: string
            format: password
            example: password123
responses:
  '201':
    description: Successfully registered
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              example: 12345
            name:
              type: string
              example: John Doe
            email:
              type: string
              example: user@example.com
  '400':
    description: Bad request
  '409':
    description: Conflict, email already exists
  '500':
    description: Internal server error
