tags:
  - Contacts
summary: Update a contact
operationId: updateContact
description: Update the details of a specific contact by its unique ID.
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: The ID of the contact to update
    schema:
      type: string
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../../components/schemas/contact.yaml'
responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/contact.yaml'
  '401':
    description: Unauthorized access or contact not found
    $ref: '../../../components/responses/401.yaml'
  '404':
    description: Contact not found
    $ref: '../../../components/responses/404.yaml'
  '500':
    description: Internal server error
