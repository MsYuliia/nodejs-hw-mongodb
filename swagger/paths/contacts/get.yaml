tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Retrieve a list of all contacts for the authenticated user.
security:
  - bearerAuth: []
parameters:
  - name: isFavourite
    in: query
    required: false
    description: Filter contacts by favourite status
    schema:
      type: boolean
      example: true
  - name: page
    in: query
    required: false
    description: Page number for pagination
    schema:
      type: integer
      minimum: 1
      example: 1
  - name: perPage
    in: query
    required: false
    description: Number of contacts per page
    schema:
      type: integer
      minimum: 1
      example: 10
  - name: sortBy
    in: query
    required: false
    description: Field to sort contacts by. Default is '_id'.
    schema:
      type: string
      example: 'name'
  - name: sortOrder
    in: query
    required: false
    description: Sort order for contacts. Can be 'asc' or 'desc'.
    schema:
      type: string
      enum: ['asc', 'desc']
      example: 'asc'
responses:
  '200':
    description: Successfully retrieved contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully retrieved contacts!
            data:
              type: object
              required:
                - data
                - page
                - limit
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: number
                  example: 1
                limit:
                  type: number
                  example: 10
                totalItems:
                  type: number
                  example: 50
                totalPages:
                  type: number
                  example: 5
                hasNextPage:
                  type: boolean
                  example: true
                hasPreviousPage:
                  type: boolean
                  example: false
  '401':
    description: Unauthorized access or contact not found
    $ref: '../../components/responses/401.yaml'
  '500':
    description: Internal server error
