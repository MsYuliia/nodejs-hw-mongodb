type: object
properties:
  _id:
    type: string
    description: Unique identifier for the contact
  name:
    type: string
    description: Name of the contact
  email:
    type: string
    description: Email address of the contact
  userId:
    type: string
    description: Unique identifier for the user who owns the contact
  phoneNumber:
    type: string
    description: Phone number of the contact
  isFavourite:
    type: boolean
    description: Indicates if the contact is marked as a favorite
  contactType:
    type: string
    enum:
      - work
      - home
      - personal
    description: Type of contact
  photo:
    type: string
    format: uri
    description: URI of the contact's photo
required:
  - _id
  - name
  - contactType
  - phoneNumber
  - userId
