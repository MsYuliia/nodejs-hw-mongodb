type: object
properties:
  id:
    type: string
    description: Unique identifier for the user
  name:
    type: string
    description: Name of the user
  email:
    type: string
    description: Email address of the user
  password:
    type: string
    description: Password of the user (hashed)
  accessToken:
    type: string
    description: Access token for authentication
  refreshToken:
    type: string
    description: Refresh token for session renewal
  sessionId:
    type: string
    description: Unique identifier for the session
  token:
    type: string
    description: Token used for password reset
required:
  - email
  - password
